name: Deploy GitHub Pages

on:
  push:
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - id: configure
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Petunjuk bila Pages belum aktif
        if: failure() && steps.configure.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages belum aktif. Buka Settings > Pages, pilih Source: GitHub Actions, lalu jalankan ulang workflow ini."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
