name: Bersihkan jejak lama (sekali jalan)

# Workflow sementara: menghapus rilis/tag v1.0.0 dan v1.1.0 (dibuat dari riwayat lama, v1.0.0 masih
# berisi opsi --key) serta dua branch Dependabot yang menunjuk ke riwayat lama. Hanya berjalan manual
# dari branch default dengan konfirmasi "HAPUS". File ini dihapus lagi setelah dijalankan.

on:
  workflow_dispatch:
    inputs:
      konfirmasi:
        description: "Ketik HAPUS untuk menghapus rilis/tag v1.0.0, v1.1.0 dan branch Dependabot lama"
        required: true

permissions:
  contents: read

jobs:
  cleanup:
    if: github.ref_name == github.event.repository.default_branch && inputs.konfirmasi == 'HAPUS'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Hapus rilis dan tag lama
        run: |
          set -euo pipefail
          for tag in v1.0.0 v1.1.0; do
            if gh release view "$tag" > /dev/null 2>&1; then
              gh release delete "$tag" --yes --cleanup-tag
              echo "rilis dan tag $tag dihapus"
            elif gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
              gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag"
              echo "tag $tag dihapus"
            else
              echo "$tag sudah tidak ada"
            fi
          done
      - name: Hapus branch Dependabot lama
        run: |
          set -euo pipefail
          for br in dependabot/github_actions/actions/download-artifact-8.0.2 dependabot/github_actions/actions/setup-python-7.1.0; do
            if gh api "repos/$GH_REPO/git/ref/heads/$br" > /dev/null 2>&1; then
              gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$br"
              echo "branch $br dihapus"
            else
              echo "branch $br sudah tidak ada"
            fi
          done
      - name: Sisa rilis dan tag
        run: |
          gh release list
          gh api "repos/$GH_REPO/git/matching-refs/tags" --jq '.[].ref'
