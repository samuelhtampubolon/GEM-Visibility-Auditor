name: Build Windows .exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# Bawaan: hanya baca. Hanya job "release" yang boleh menulis (membuat rilis).
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Read version
        id: ver
        run: echo "version=$(python -c 'import gem_visibility_auditor as g; print(g.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build CLI exe (dependensi inti saja agar ukuran kecil)
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib requests pyinstaller pytest
          pyinstaller --onefile --name GEM-Visibility-Auditor gem_visibility_auditor.py
      - name: Smoke test CLI exe
        env:
          GEM_EXE_PATH: ${{ github.workspace }}/dist/GEM-Visibility-Auditor.exe
          PYTHONIOENCODING: utf-8
        run: |
          ./dist/GEM-Visibility-Auditor.exe --version
          python -m pytest -v tests/test_exe.py

      - name: Build dashboard exe
        run: |
          pip install streamlit
          pyinstaller --onefile --name GEM-Dashboard --collect-all streamlit --copy-metadata streamlit --add-data "streamlit_app.py:." --add-data "gem_visibility_auditor.py:." --hidden-import gem_visibility_auditor dashboard_launcher.py
      - name: Smoke test dashboard exe
        run: |
          GEM_DASHBOARD_HEADLESS=true GEM_DASHBOARD_PORT=8599 ./dist/GEM-Dashboard.exe > dash.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8599/_stcore/health; then echo " dashboard OK"; break; fi
            sleep 2
          done
          curl -sf http://localhost:8599/_stcore/health
          curl -sf http://localhost:8599/ | grep -qi "streamlit"
          taskkill //F //IM GEM-Dashboard.exe || true
          cat dash.log

      - name: Checksums
        run: |
          cd dist
          sha256sum GEM-Visibility-Auditor.exe GEM-Dashboard.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-exe
          path: |
            dist/GEM-Visibility-Auditor.exe
            dist/GEM-Dashboard.exe
            dist/SHA256SUMS.txt
          retention-days: 30

  release:
    # Rilis hanya dari branch default atau tag v*, dan TIDAK PERNAH menimpa rilis yang sudah ada.
    # Untuk rilis baru, naikkan __version__ di gem_visibility_auditor.py.
    needs: build
    if: github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-exe
          path: dist
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS.txt
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Rilis $TAG sudah ada dan tidak ditimpa. Naikkan __version__ untuk rilis baru."
            exit 0
          fi
          cat > notes.md <<NOTES
          Unduh \`GEM-Visibility-Auditor.exe\` (CLI/wizard) atau \`GEM-Dashboard.exe\` (dashboard Streamlit).

          - Klik dua kali \`GEM-Visibility-Auditor.exe\` untuk wizard interaktif, atau jalankan
            \`GEM-Visibility-Auditor.exe --demo\` (tanpa kunci API) dan
            \`GEM-Visibility-Auditor.exe --models anthropic gemini openai\`.
          - Kunci API dibaca dari environment variable atau file \`.env\` di samping .exe, tidak lewat argumen.
          - Verifikasi file: bandingkan SHA-256 dengan \`SHA256SUMS.txt\`
            (PowerShell: \`Get-FileHash .\\GEM-Visibility-Auditor.exe\`).
          - File belum ditandatangani kode (code signing), jadi Windows SmartScreen bisa memberi peringatan.

          Dibangun otomatis dari commit ${TARGET} dan lolos smoke test di Windows.
          NOTES
          gh release create "$TAG" dist/GEM-Visibility-Auditor.exe dist/GEM-Dashboard.exe dist/SHA256SUMS.txt \
            --target "$TARGET" --title "GEM Visibility Auditor $TAG" --notes-file notes.md --latest
